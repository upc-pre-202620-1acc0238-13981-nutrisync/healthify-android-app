name: Distribute

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: distribute
  cancel-in-progress: false

jobs:
  distribute:
    name: Signed release to Firebase App Distribution and GitHub
    runs-on: ubuntu-latest
    permissions:
      # Creates the version tag and the GitHub release.
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 20

      # A push to main must bring a new versionName; a manual run of an already released version only redistributes it.
      - name: Check the version is new
        id: version
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo "::error::v$version is already released. Bump versionName in app/build.gradle.kts."
              exit 1
            fi
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Write signing key and Firebase credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Write release notes
        run: git log -10 --no-merges --pretty=format:'- %s' > "$RUNNER_TEMP/release-notes.txt"

      - name: Build and upload
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_CREDENTIALS_FILE: ${{ runner.temp }}/firebase-service-account.json
        run: >
          ./gradlew assembleRelease
          appDistributionUploadRelease --releaseNotesFile="$RUNNER_TEMP/release-notes.txt"
          -PversionCode=${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: healthify-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub release
        if: steps.version.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/healthify-$TAG.apk"
          gh release create "$TAG" "$RUNNER_TEMP/healthify-$TAG.apk" \
            --target "$GITHUB_SHA" --title "$TAG" --generate-notes

      - name: Remove signing key and credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/firebase-service-account.json"
